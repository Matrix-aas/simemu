name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build & publish (e.g. v0.1.0), or leave empty for dry-run artifacts"
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: Verify Version & Branch
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag against Cargo.toml & main branch
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          CARGO_VER=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            EXPECTED="v${CARGO_VER}"
            if [[ "${TAG}" != "${EXPECTED}" ]]; then
              echo "::error::Tag '${TAG}' does not match Cargo.toml workspace version '${CARGO_VER}' (expected '${EXPECTED}')"
              exit 1
            fi
            git fetch origin main:refs/remotes/origin/main
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "::error::Release tag '${TAG}' must point to a commit on 'main'"
              exit 1
            fi
            echo "version=${CARGO_VER}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=${CARGO_VER}" >> "$GITHUB_OUTPUT"
            echo "tag=v${CARGO_VER}-ci" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            bin: simemu.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
            bin: simemu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            bin: simemu
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin: simemu
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            bin: simemu
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build pure-Rust release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin simemu

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          STAGE="simemu-${{ needs.verify.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "${STAGE}/rom" \
                   "${STAGE}/docs" \
                   "${STAGE}/definitions" \
                   "${STAGE}/vault/firmwares/ecu/frf" \
                   "${STAGE}/vault/firmwares/ecu/stock" \
                   "${STAGE}/vault/firmwares/ecu/bench" \
                   "${STAGE}/vault/firmwares/ecu/custom" \
                   "${STAGE}/vault/firmwares/tcu/dq200" \
                   "${STAGE}/vault/firmwares/tcu/dq250"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${STAGE}/${{ matrix.bin }}"
          strip "${STAGE}/${{ matrix.bin }}" || true
          cp rom/sboot.bin rom/dflash.bin "${STAGE}/rom/"
          cp docs/FIRMWARE_AND_BOOT_GUIDE.md docs/FIRMWARE_AND_BOOT_GUIDE.ru.md "${STAGE}/docs/"
          cp definitions/*.json "${STAGE}/definitions/"
          cp LICENSE README.md README.ru.md "${STAGE}/"
          printf "Place your VAG .frf / .bin ECU & TCU dumps under these subdirectories (see README.md).\n" > "${STAGE}/vault/firmwares/README.txt"
          mkdir -p dist
          tar -czf "dist/${STAGE}.tar.gz" "${STAGE}"

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Stage = "simemu-${{ needs.verify.outputs.tag }}-${{ matrix.target }}"
          foreach ($d in @(
            "$Stage/rom",
            "$Stage/docs",
            "$Stage/definitions",
            "$Stage/vault/firmwares/ecu/frf",
            "$Stage/vault/firmwares/ecu/stock",
            "$Stage/vault/firmwares/ecu/bench",
            "$Stage/vault/firmwares/ecu/custom",
            "$Stage/vault/firmwares/tcu/dq200",
            "$Stage/vault/firmwares/tcu/dq250"
          )) {
            New-Item -ItemType Directory -Force -Path $d | Out-Null
          }
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "$Stage/${{ matrix.bin }}"
          Copy-Item "rom/sboot.bin", "rom/dflash.bin" "$Stage/rom/"
          Copy-Item "docs/FIRMWARE_AND_BOOT_GUIDE.md", "docs/FIRMWARE_AND_BOOT_GUIDE.ru.md" "$Stage/docs/"
          Copy-Item "definitions/*.json" "$Stage/definitions/"
          Copy-Item "LICENSE", "README.md", "README.ru.md" "$Stage/"
          Set-Content -Path "$Stage/vault/firmwares/README.txt" -Value "Place your VAG .frf / .bin ECU & TCU dumps under these subdirectories (see README.md)." -Encoding UTF8
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "$Stage" -DestinationPath "dist/$Stage.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: artifacts
        run: |
          sha256sum simemu-* | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: "SimEmu ${{ needs.verify.outputs.tag }}"
          generate_release_notes: true
          files: |
            artifacts/simemu-*
            artifacts/SHA256SUMS.txt
