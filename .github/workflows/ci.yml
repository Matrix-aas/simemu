name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-and-test:
    name: Pure-Rust Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy (default pure-Rust features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check minimal CLI (--no-default-features)
        run: cargo check -p simemu-cli --no-default-features

      - name: Run workspace tests (Native TriCore core)
        run: cargo test --release --workspace

      - name: Smoke-check CLI binary
        run: cargo run --release --bin simemu -- --version

  unicorn-differential:
    name: Unicorn 2.1.4 Differential Oracle (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build

      - name: Cache patched libunicorn 2.1.4
        id: unicorn-cache
        uses: actions/cache@v4
        with:
          path: .unicorn-simemu/build
          key: unicorn-2.1.4-tricore-${{ runner.os }}-${{ hashFiles('scripts/unicorn-2.1.4-simemu.patch', 'scripts/build_unicorn.py') }}

      - name: Build patched libunicorn 2.1.4
        if: steps.unicorn-cache.outputs.cache-hit != 'true'
        run: python3 scripts/build_unicorn.py --out .unicorn-simemu

      - uses: Swatinem/rust-cache@v2
        with:
          key: with-unicorn

      - name: Clippy (--all-features, including unicorn)
        env:
          UNICORN_LIB_DIR: ${{ github.workspace }}/.unicorn-simemu/build
          UNICORN_STATIC: "1"
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run differential ISA & board tests against Unicorn
        env:
          UNICORN_LIB_DIR: ${{ github.workspace }}/.unicorn-simemu/build
          UNICORN_STATIC: "1"
        run: cargo test --release --workspace --all-features
