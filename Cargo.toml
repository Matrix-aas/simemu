[workspace]
resolver = "2"
members = [
    "crates/unicorn-tricore-sys",
    "crates/simemu-tc1791",
    "crates/simemu-physics",
    "crates/simemu-acoustics",
    "crates/simemu-damos",
    "crates/simemu-bridge",
    "crates/simemu-cli",
    "crates/tricore-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license-file = "LICENSE"
authors = ["Matrix"]
repository = "https://github.com/Matrix-aas/simemu"
readme = "README.md"
keywords = ["ecu", "tricore", "emulator", "automotive", "hil-sil"]
categories = ["emulators", "simulation", "science", "embedded"]

[workspace.dependencies]
miniz_oxide = "0.8"
nalgebra = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
